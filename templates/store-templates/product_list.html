<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>منتجات المتجر</title>
  <style>
    body {
      font-family: "Tahoma", sans-serif;
      background-color: #fff;
      color: #000;
      margin: 0;
      padding: 0;
    }

    h2 {
      text-align: center;
      color: #c00000;
      margin: 30px 0;
    }

    .products-container {
      width: 90%;
      margin: 0 auto 50px;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
      gap: 25px;
    }

    .product-card {
      border: 2px solid #c00000;
      border-radius: 10px;
      padding: 15px;
      text-align: center;
      box-shadow: 0 0 8px rgba(0,0,0,0.1);
      transition: transform 0.3s ease;
      background: #fff;
    }

    .product-card:hover {
      transform: translateY(-5px);
    }

    .product-card img {
      width: 100%;
      height: 200px;
      object-fit: cover;
      border-radius: 8px;
      border: 1px solid #ccc;
    }

    .product-name {
      font-weight: bold;
      font-size: 18px;
      margin-top: 10px;
      color: #000;
    }

    .price {
      color: #c00000;
      font-weight: bold;
      margin-top: 5px;
    }

    .details-btn {
      display: inline-block;
      margin-top: 10px;
      padding: 8px 15px;
      background-color: #c00000;
      color: #fff;
      text-decoration: none;
      border-radius: 5px;
      transition: background 0.3s;
    }

    .details-btn:hover {
      background-color: #900000;
    }

    .no-products {
      text-align: center;
      color: #666;
      margin-top: 50px;
      font-size: 18px;
    }
  </style>
</head>
<body>

  <h2>🛍️ منتجات متجر أدوات السلامة المهنية</h2>

  {% if products %}
  <div class="products-container">
    {% for product in products %}
      <div class="product-card">
        {% if product.image %}
          <img src="{{ product.image.url }}" alt="{{ product.name }}">
        {% else %}
          <img src="/static/default-product.png" alt="صورة المنتج">
        {% endif %}
        <div class="product-name">{{ product.name }}</div>
        <div class="price">{{ product.price }} ر.س</div>
        <a href="{% url 'store-product-detail' product.id %}" class="details-btn">عرض التفاصيل</a>
      </div>
    {% endfor %}
  </div>
  {% else %}
    <div class="no-products">لا توجد منتجات متاحة حاليًا.</div>
  {% endif %}

</body>
</html>
