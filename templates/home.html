<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>الصفحة الرئيسية | أدوات السلامة المهنية</title>
  <style>
    body {
      margin: 0;
      font-family: "Tahoma", Arial, sans-serif;
      background-color: #fff;
      color: #000;
    }
    main {
      width: 90%;
      margin: 30px auto;
      text-align: center;
    }
    .hero {
      background-color: #f9f9f9;
      border: 2px solid #c00000;
      padding: 40px 20px;
      border-radius: 10px;
    }
    .hero h1 {
      color: #c00000;
      font-size: 32px;
      margin-bottom: 15px;
    }
    .hero p {
      font-size: 18px;
      line-height: 1.8;
      color: #333;
    }
    .btn {
      display: inline-block;
      background-color: #c00000;
      color: #fff;
      padding: 10px 25px;
      margin-top: 20px;
      border-radius: 5px;
      text-decoration: none;
      font-weight: bold;
      transition: background 0.3s ease;
    }
    .btn:hover {
      background-color: #900000;
    }
  </style>
</head>
<body>

  {% include 'header.html' %}

  <main>
    <section class="hero">
      <h1>مرحبًا بكم في متجر أدوات السلامة المهنية</h1>
      <p>
        نحن متخصصون في توفير جميع أدوات ومستلزمات السلامة المهنية — 
        من الخوذ، القفازات، النظارات الواقية، وأجهزة الحماية الحديثة.
      </p>
      <a href="#" class="btn">تصفح المنتجات</a>
    </section>
  </main>

  {% include 'footer.html' %}

</body>
</html>
