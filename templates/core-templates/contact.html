<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>اتصل بنا | سلامتك</title>
  <style>
    body {
      margin: 0;
      font-family: "Tahoma", Arial, sans-serif;
      background-color: #fff;
      color: #000;
    }

    main {
      width: 85%;
      margin: 50px auto;
      padding: 30px;
      background: #fff;
      border: 2px solid #c00000;
      border-radius: 15px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.1);
      text-align: center;
    }

    h1 {
      color: #c00000;
      font-size: 32px;
      margin-bottom: 10px;
    }

    p {
      color: #444;
      font-size: 18px;
      margin-bottom: 30px;
    }

    form {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 15px;
      width: 100%;
      max-width: 600px;
      margin: 0 auto;
    }

    input, textarea {
      width: 100%;
      padding: 12px;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 16px;
      transition: border 0.3s ease;
    }

    input:focus, textarea:focus {
      border-color: #c00000;
      outline: none;
    }

    textarea {
      resize: vertical;
      min-height: 120px;
    }

    button {
      background-color: #c00000;
      color: #fff;
      padding: 12px 30px;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      transition: background 0.3s ease;
    }

    button:hover {
      background-color: #900000;
    }

    .contact-info {
      margin-top: 40px;
      text-align: center;
      color: #555;
      font-size: 17px;
      line-height: 1.8;
    }

    .contact-info a {
      color: #c00000;
      text-decoration: none;
      font-weight: bold;
    }

    .contact-info a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>

  {% include 'header.html' %}

  <main>
    <h1>📞 اتصل بنا</h1>
    <p>يسعدنا تواصلك معنا لأي استفسار أو ملاحظات.</p>

    <form action="#" method="post">
      {% csrf_token %}
      <input type="text" name="name" placeholder="الاسم الكامل" required>
      <input type="email" name="email" placeholder="البريد الإلكتروني" required>
      <textarea name="message" placeholder="اكتب رسالتك هنا..." required></textarea>
      <button type="submit">إرسال الرسالة</button>
    </form>

    <div class="contact-info">
      <p>📧 البريد الإلكتروني: <a href="mailto:info@salamtek.sa">info@salamtek.sa</a></p>
      <p>📱 الهاتف: <a href="tel:+966500000000">+966 50 000 0000</a></p>
      <p>🏢 العنوان: الرياض، المملكة العربية السعودية</p>
    </div>
  </main>

  {% include 'footer.html' %}
</body>
</html>
